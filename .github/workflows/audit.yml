name: audit

# reports/audit.sh is the single gate. It skips the steps that need the
# restricted DuckDB bundle, which is not available here and lives outside the
# checkout under separate controls, and runs the eight that do not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The audit compares HEAD against origin/main, which a shallow clone
          # cannot resolve.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install the locked dependency set
        run: uv sync --frozen

      - name: Audit
        run: ./reports/audit.sh
