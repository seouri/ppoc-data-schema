[project]
name = "ppoc-synthetic-fixtures"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
