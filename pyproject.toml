[project]
name = "ppoc-synthetic-fixtures"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.3,<2",
  "numpy>=2.0,<3",
  "pandas>=2.3.2,<3",
  "pyarrow>=23.0.0,<24",
  "scipy>=1.16.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "scale: opt-in 10,000-member development integration profile",
]

[tool.ruff]
target-version = "py312"
line-length = 100

# scripts/augment.py and scripts/harrall_outliers.py are vendored byte-identical
# from the data delivery and pinned by SHA-256 in
# data/augment-runtime-manifest.json, which tests/test_augment_import.py
# enforces: any edit to them, down to a trailing comment, fails that test and
# breaks the runtime closure. Their style findings are real but un-actionable,
# and the files cannot carry `noqa` comments for the same reason, so the
# exemption is recorded here instead of being silenced in place.
[tool.ruff.lint.per-file-ignores]
"scripts/augment.py" = ["ALL"]
"scripts/harrall_outliers.py" = ["ALL"]
